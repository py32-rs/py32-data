name: metapac publish

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Use nightly Rust
      run: rustup default nightly
    - name: Deploy SSH key
      run: |
        mkdir ~/.ssh
        echo "${{ secrets.NIGHTLIES_KEY }}" > ~/.ssh/id_rsa
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa github.com
    - name: Build
      run: |
        git clone --depth=1 https://github.com/py32-rs/py32-metapac build/py32-metapac -q
        rm -rf build/py32-metapac/*
        COMMIT=$(git rev-parse HEAD)
        COMMIT_MESSAGE=$(git log -1 --pretty=%B)
        ./d gen
        cd build/py32-metapac/
        cp -v ../../LICENSE* .
        find src -iname '*.rs' -exec rustfmt -v {} \;
        git add .
        git config user.name "py32-data builder"
        git config user.email "action@github.com"
        git commit -m "py32-rs/py32-data master $COMMIT"
    - name: Test
      run: |
        cd build/py32-metapac/
        cargo doc --features py32f030k28,metadata
    - name: Push
      run: |
        cd build/py32-metapac/
        git push origin main
