# Internal peripheral trigger topology from the PY32F07X reference manual.
DAC:
- signal: DAC_CHX_TRG0
  source: TIM6_TRGO
- signal: DAC_CHX_TRG1
  source: TIM3_TRGO
- signal: DAC_CHX_TRG2
  source: TIM7_TRGO
- signal: DAC_CHX_TRG3
  source: TIM15_TRGO
- signal: DAC_CHX_TRG4
  source: TIM2_TRGO
- signal: DAC_CHX_TRG6
  source: EXTI9_TRG
