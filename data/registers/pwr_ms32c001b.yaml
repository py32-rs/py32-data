block/PWR:
  description: Power control.
  items:
  - name: CR1
    description: Power control register 1.
    byte_offset: 0
    fieldset: CR1
  - name: CR2
    description: Power control register 2.
    byte_offset: 4
    fieldset: CR2
  - name: SR
    description: Power status register.
    byte_offset: 16
    access: Read
    fieldset: SR
fieldset/CR1:
  description: Power control register 1.
  fields:
  - name: FLS_SLPTIME
    description: Flash wait time after wakeup from the stop mode.
    bit_offset: 12
    bit_size: 2
  - name: VR_MODE
    description: Voltage regulator mode in stop mode.
    bit_offset: 14
    bit_size: 2
  - name: HSION_CTRL
    description: HSI open time control.
    bit_offset: 22
    bit_size: 1
fieldset/CR2:
  description: Power control register 2.
  fields:
  - name: PVDE
    description: Power voltage detector enable.
    bit_offset: 0
    bit_size: 1
  - name: PVDT
    description: Power voltage detector threshold selection.
    bit_offset: 4
    bit_size: 3
  - name: PVD_OUT_SEL
    description: Power voltage detector output selection.
    bit_offset: 7
    bit_size: 1
  - name: FLTEN
    description: Digital filter enable.
    bit_offset: 8
    bit_size: 1
  - name: FLT_TIME
    description: Digital filter time configuration.
    bit_offset: 9
    bit_size: 3
fieldset/SR:
  description: Power status register.
  fields:
  - name: PVDO
    description: PVD output.
    bit_offset: 11
    bit_size: 1
